# SUPERSEDED -- these two jobs are already merged into the real workflow
# at .github/workflows/deploy-cloud-pipeline.yml (deploy-dashboard-api /
# deploy-frontend jobs). This leftover copy couldn't be deleted (sandbox
# filesystem quirk) -- ignore it, do not paste it anywhere.
#
# Paste these two jobs into the existing root-level
# .github/workflows/deploy-cloud-pipeline.yml (the file that already deploys
# ingest/doc-parser/validator/ai-proposals/notifier/job-trigger). Not a
# standalone workflow -- this repo only has ONE workflow file, at the repo
# root, because GitHub only picks up workflows under the top-level
# .github/workflows/. This file lives in cloud-pipeline/docs/ so it doesn't
# get silently ignored if committed as-is; copy the jobs below into the real
# workflow and delete this file (or keep it as a reference).
#
# Assumes the existing workflow already has:
#   - a `workflow_dispatch` trigger with an `input` selecting which job(s) to run
#   - GCP auth already set up (google-github-actions/auth, WIF or SA key)
#   - PROJECT_ID / REGION as env vars or repo variables
#
# Adjust `if:` conditions to match however the existing workflow's
# workflow_dispatch input is named/checked for the other services.

  deploy-dashboard-api:
    if: ${{ github.event.inputs.target == 'dashboard-api' || github.event.inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy dashboard-api to Cloud Run
        run: |
          gcloud run deploy dashboard-api \
            --source cloud-pipeline/services/dashboard-api \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},BQ_DATASET=audit_controls,GCP_REGION=us-central1

  deploy-frontend:
    if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'all' }}
    needs: deploy-dashboard-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Get dashboard-api URL
        id: api_url
        run: |
          URL=$(gcloud run services describe dashboard-api \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Configure Docker for Artifact Registry / gcr.io
        run: gcloud auth configure-docker gcr.io --quiet
      # NEXT_PUBLIC_* vars are build-time, so this can't go through
      # `gcloud run deploy --source`'s buildpack path -- build explicitly.
      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ steps.api_url.outputs.url }} \
            --build-arg NEXT_PUBLIC_LOOKER_EMBED_URL="${{ secrets.LOOKER_EMBED_URL }}" \
            -t gcr.io/${{ env.PROJECT_ID }}/dashboard-frontend:${{ github.sha }} \
            cloud-pipeline/frontend
          docker push gcr.io/${{ env.PROJECT_ID }}/dashboard-frontend:${{ github.sha }}
      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy dashboard-frontend \
            --image gcr.io/${{ env.PROJECT_ID }}/dashboard-frontend:${{ github.sha }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated
