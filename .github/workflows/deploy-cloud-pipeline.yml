# This project's root IS this folder (services/, terraform/, frontend/, etc.
# all live at the top level) -- so this file is already in the one place
# GitHub actually reads workflows from: <repo-root>/.github/workflows/.
#
# One-time setup before this workflow can run (see README.md /
# scripts/setup_workload_identity.sh):
#   - GCS bucket + BigQuery tables + Pub/Sub topics already created
#     (terraform apply, or scripts/manual_gcp_setup.sh)
#   - Workload Identity Federation set up (scripts/setup_workload_identity.sh)
#   - GitHub secrets set: WIF_PROVIDER, WIF_SERVICE_ACCOUNT
#   - GitHub repo variable (or hardcode below): LOOKER_EMBED_URL (optional,
#     only needed once you have a Looker Studio report to embed)

name: Deploy Cloud Pipeline

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        type: choice
        default: all
        options:
          - all
          - doc-parser
          - ingest
          - validator
          - ai-proposals
          - notifier
          - triggers
          - dashboard-api
          - frontend

env:
  PROJECT_ID: ringed-hearth-504112-e3
  REGION: europe-west1
  BUCKET_NAME: ringed-hearth-504112-e3-dq-bucket
  RUNTIME_SA_EMAIL: dq-pipeline-runtime@ringed-hearth-504112-e3.iam.gserviceaccount.com

jobs:
  # ---------------------------------------------------------------------
  # Eventarc-triggered Cloud Run *services* (doc-parser, ingest, notifier)
  # ---------------------------------------------------------------------
  deploy-doc-parser:
    if: ${{ contains(fromJSON('["all","doc-parser"]'), github.event.inputs.target) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run deploy doc-parser \
            --source services/doc-parser \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA_EMAIL }} \
            --no-allow-unauthenticated \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},BUCKET=${{ env.BUCKET_NAME }}

  deploy-ingest:
    if: ${{ contains(fromJSON('["all","ingest"]'), github.event.inputs.target) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run deploy ingest \
            --source services/ingest \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA_EMAIL }} \
            --no-allow-unauthenticated \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},BUCKET=${{ env.BUCKET_NAME }},DATA_REGION="United States"

  deploy-notifier:
    if: ${{ contains(fromJSON('["all","notifier"]'), github.event.inputs.target) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run deploy notifier \
            --source services/notifier \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA_EMAIL }} \
            --no-allow-unauthenticated \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},MAIL_PROVIDER=log_only

  # ---------------------------------------------------------------------
  # Cloud Run *Jobs* (batch steps, not services -- validator, ai-proposals)
  # ---------------------------------------------------------------------
  deploy-validator:
    if: ${{ contains(fromJSON('["all","validator"]'), github.event.inputs.target) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build validator image
        run: |
          gcloud builds submit services/validator \
            --project ${{ env.PROJECT_ID }} \
            --tag gcr.io/${{ env.PROJECT_ID }}/validator:${{ github.sha }}
      - name: Create or update validator job
        run: |
          gcloud run jobs describe validator --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} >/dev/null 2>&1 && ACTION=update || ACTION=create
          gcloud run jobs $ACTION validator \
            --image gcr.io/${{ env.PROJECT_ID }}/validator:${{ github.sha }} \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA_EMAIL }} \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},RULES_REGISTRY_PATH=gs://${{ env.BUCKET_NAME }}/specs/rules_registry.yaml,TARGET_TABLE_REGISTRY_PATH=gs://${{ env.BUCKET_NAME }}/specs/target_table_registry.yaml

  deploy-ai-proposals:
    if: ${{ contains(fromJSON('["all","ai-proposals"]'), github.event.inputs.target) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build ai-proposals image
        run: |
          gcloud builds submit services/ai-proposals \
            --project ${{ env.PROJECT_ID }} \
            --tag gcr.io/${{ env.PROJECT_ID }}/ai-proposals:${{ github.sha }}
      - name: Create or update ai-proposals job
        run: |
          gcloud run jobs describe ai-proposals --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} >/dev/null 2>&1 && ACTION=update || ACTION=create
          gcloud run jobs $ACTION ai-proposals \
            --image gcr.io/${{ env.PROJECT_ID }}/ai-proposals:${{ github.sha }} \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA_EMAIL }} \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},GCP_REGION=us-central1

  # ---------------------------------------------------------------------
  # Eventarc wiring -- GCS triggers for doc-parser/ingest, job-trigger
  # deployed twice (Pub/Sub -> Cloud Run Jobs bridge), notifier's Pub/Sub
  # trigger. Run this AFTER the services/jobs above already exist.
  # Re-running `gcloud eventarc triggers create` on an existing trigger
  # errors (not idempotent) -- hence the describe-then-create/update dance.
  # ---------------------------------------------------------------------
  deploy-triggers:
    if: ${{ contains(fromJSON('["all","triggers"]'), github.event.inputs.target) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: GCS trigger -- doc-parser on functional-docs/*.docx
        run: |
          gcloud eventarc triggers describe doc-parser-trigger --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} >/dev/null 2>&1 || \
          gcloud eventarc triggers create doc-parser-trigger \
            --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} \
            --destination-run-service doc-parser --destination-run-region ${{ env.REGION }} \
            --event-filters "type=google.cloud.storage.object.v1.finalized" \
            --event-filters "bucket=${{ env.BUCKET_NAME }}" \
            --service-account ${{ env.RUNTIME_SA_EMAIL }}

      - name: GCS trigger -- ingest on incoming/*.csv
        run: |
          gcloud eventarc triggers describe ingest-trigger --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} >/dev/null 2>&1 || \
          gcloud eventarc triggers create ingest-trigger \
            --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} \
            --destination-run-service ingest --destination-run-region ${{ env.REGION }} \
            --event-filters "type=google.cloud.storage.object.v1.finalized" \
            --event-filters "bucket=${{ env.BUCKET_NAME }}" \
            --service-account ${{ env.RUNTIME_SA_EMAIL }}

      - name: Build job-trigger image (shared by both instances below)
        run: |
          gcloud builds submit services/job-trigger \
            --project ${{ env.PROJECT_ID }} \
            --tag gcr.io/${{ env.PROJECT_ID }}/job-trigger:${{ github.sha }}

      - name: Deploy trigger-validator (staging-loaded -> validator job)
        run: |
          gcloud run deploy trigger-validator \
            --image gcr.io/${{ env.PROJECT_ID }}/job-trigger:${{ github.sha }} \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA_EMAIL }} --no-allow-unauthenticated \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},TARGET_JOB_NAME=validator,TARGET_REGION=${{ env.REGION }},ENV_OVERRIDE_KEYS=batch_id=BATCH_ID
          gcloud eventarc triggers describe validator-pubsub-trigger --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} >/dev/null 2>&1 || \
          gcloud eventarc triggers create validator-pubsub-trigger \
            --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} \
            --destination-run-service trigger-validator --destination-run-region ${{ env.REGION }} \
            --event-filters "type=google.cloud.pubsub.topic.v1.messagePublished" \
            --transport-topic "projects/${{ env.PROJECT_ID }}/topics/staging-loaded" \
            --service-account ${{ env.RUNTIME_SA_EMAIL }}

      - name: Deploy trigger-ai-proposals (validation-complete -> ai-proposals job)
        run: |
          gcloud run deploy trigger-ai-proposals \
            --image gcr.io/${{ env.PROJECT_ID }}/job-trigger:${{ github.sha }} \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA_EMAIL }} --no-allow-unauthenticated \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},TARGET_JOB_NAME=ai-proposals,TARGET_REGION=${{ env.REGION }},ENV_OVERRIDE_KEYS=run_id=RUN_ID
          gcloud eventarc triggers describe ai-proposals-pubsub-trigger --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} >/dev/null 2>&1 || \
          gcloud eventarc triggers create ai-proposals-pubsub-trigger \
            --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} \
            --destination-run-service trigger-ai-proposals --destination-run-region ${{ env.REGION }} \
            --event-filters "type=google.cloud.pubsub.topic.v1.messagePublished" \
            --transport-topic "projects/${{ env.PROJECT_ID }}/topics/validation-complete" \
            --service-account ${{ env.RUNTIME_SA_EMAIL }}

      - name: Pub/Sub trigger -- new-proposal -> notifier
        run: |
          gcloud eventarc triggers describe notifier-trigger --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} >/dev/null 2>&1 || \
          gcloud eventarc triggers create notifier-trigger \
            --project ${{ env.PROJECT_ID }} --location ${{ env.REGION }} \
            --destination-run-service notifier --destination-run-region ${{ env.REGION }} \
            --event-filters "type=google.cloud.pubsub.topic.v1.messagePublished" \
            --transport-topic "projects/${{ env.PROJECT_ID }}/topics/new-proposal" \
            --service-account ${{ env.RUNTIME_SA_EMAIL }}

  # ---------------------------------------------------------------------
  # Custom dashboard: dashboard-api (plain REST service) + frontend
  # (Next.js, NEXT_PUBLIC_* vars baked in at build time)
  # ---------------------------------------------------------------------
  deploy-dashboard-api:
    if: ${{ contains(fromJSON('["all","dashboard-api"]'), github.event.inputs.target) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run deploy dashboard-api \
            --source services/dashboard-api \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA_EMAIL }} \
            --allow-unauthenticated \
            --set-env-vars BQ_PROJECT=${{ env.PROJECT_ID }},BQ_DATASET=audit_controls,GCP_REGION=us-central1,BUCKET=${{ env.BUCKET_NAME }}

  deploy-frontend:
    # `needs:` implicitly requires deploy-dashboard-api to have *succeeded in
    # this same run* -- but when you dispatch target=frontend on its own
    # (dashboard-api already deployed in an earlier run), deploy-dashboard-api
    # is intentionally skipped this time, and "skipped" isn't "success", so
    # without the explicit result check below this job would silently skip
    # too. always() + the explicit success-or-skipped check restores the
    # intended behavior: run whenever frontend was requested, as long as
    # dashboard-api didn't outright fail in this run.
    if: |
      always() &&
      contains(fromJSON('["all","frontend"]'), github.event.inputs.target) &&
      (needs.deploy-dashboard-api.result == 'success' || needs.deploy-dashboard-api.result == 'skipped')
    needs: deploy-dashboard-api
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Get dashboard-api URL
        id: api_url
        run: |
          URL=$(gcloud run services describe dashboard-api \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - run: gcloud auth configure-docker gcr.io --quiet
      # NEXT_PUBLIC_* vars are build-time, so this can't go through
      # `gcloud run deploy --source`'s buildpack path -- build explicitly.
      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ steps.api_url.outputs.url }} \
            --build-arg NEXT_PUBLIC_LOOKER_EMBED_URL="${{ vars.LOOKER_EMBED_URL }}" \
            -t gcr.io/${{ env.PROJECT_ID }}/dashboard-frontend:${{ github.sha }} \
            frontend
          docker push gcr.io/${{ env.PROJECT_ID }}/dashboard-frontend:${{ github.sha }}
      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy dashboard-frontend \
            --image gcr.io/${{ env.PROJECT_ID }}/dashboard-frontend:${{ github.sha }} \
            --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} \
            --allow-unauthenticated
